services:
  - type: web
    name: yatrabook-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # We rely on the in-memory fallback if MONGODB_URI is not provided, 
      # but you can add MONGODB_URI and JWT_SECRET directly in the Render dashboard!

  - type: web
    name: yatrabook-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      # You will need to update this VITE_API_URL in the Render dashboard 
      # once the API service above is generated (e.g., https://yatrabook-api.onrender.com/api)
